<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"> <title>Every day closer to you</title> <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Dancing+Script:wght@600&display=swap" rel="stylesheet"> <style> *{box-sizing:border-box;margin:0} body{min-height:100vh;color:#5a2236;font-family:'Playfair Display',serif;text-align:center;overflow-x:hidden;background:linear-gradient(160deg,#fff0f3 0%,#ffd9e4 45%,#f7c6d9 100%);background-attachment:fixed} .hearts{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden} .hearts i{position:absolute;bottom:-40px;font-style:normal;opacity:.0;animation:up linear infinite} @keyframes up{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.7}100%{transform:translateY(-110vh) rotate(40deg);opacity:0}} main{position:relative;z-index:1} h1{font-family:'Dancing Script',cursive;font-size:3rem;padding:34px 12px 2px;color:#c2185b;text-shadow:0 2px 10px #fff} .sub{color:#a34868;font-style:italic;padding-bottom:6px} .orn{color:#d4a24c;letter-spacing:.5em;padding-bottom:16px} .wrap{max-width:460px;margin:auto;padding:0 14px} .car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:22px} .car::-webkit-scrollbar{display:none} .s{flex:0 0 100%;scroll-snap-align:center;position:relative;height:72vh;max-height:620px;padding:12px;background:#fff;border-radius:22px;box-shadow:0 14px 40px rgba(194,24,91,.25);border:2px solid #e9c77b} .s img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:14px} .s .t{position:absolute;left:12px;right:12px;bottom:12px;padding:70px 18px 20px;background:linear-gradient(transparent,rgba(120,10,60,.82));border-radius:0 0 14px 14px;font-size:1.1rem;font-style:italic;color:#fff;text-shadow:0 1px 6px #0006} .dots{display:flex;justify-content:center;gap:7px;padding:16px 0 6px} .dots span{width:8px;height:8px;border-radius:50%;background:#f1a9c0;transition:.3s} .dots span.on{background:#c2185b;transform:scale(1.5)} .nav{display:flex;justify-content:center;gap:14px;padding:6px 0 10px} button{background:linear-gradient(135deg,#ec4f86,#c2185b);color:#fff;border:0;border-radius:30px;padding:10px 24px;font-size:1.1rem;cursor:pointer;box-shadow:0 6px 16px rgba(194,24,91,.35)} .cd{margin:26px auto 60px;max-width:480px;padding:30px 16px 26px;background:rgba(255,255,255,.55);backdrop-filter:blur(6px);border:2px solid #e9c77b;border-radius:30px;box-shadow:0 12px 40px rgba(194,24,91,.2)} .cd h2{font-family:'Dancing Script',cursive;font-size:2.5rem;color:#c2185b;margin-bottom:6px} .hw{position:relative;width:260px;margin:0 auto;filter:drop-shadow(0 10px 18px rgba(194,24,91,.3));animation:beat 2s ease-in-out infinite} .hs{width:100%;display:block} .hn{position:absolute;left:0;right:0;top:30%;text-align:center} .hn b{display:block;font-family:'Dancing Script',cursive;font-size:4.6rem;line-height:1;color:#c2185b} .hn span{font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:#a34868} .hms{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:14px} .hms div{min-width:70px}.hms b{display:block;font-family:'Dancing Script',cursive;font-size:2.4rem;color:#b0124f} .hms span{font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:#a34868} .hms em{font-style:normal;color:#e9a0ba;font-size:1.1rem} @keyframes beat{50%{transform:scale(1.04)}} .fin{margin-top:18px;font-style:italic;color:#a34868;line-height:1.6} .heart{font-size:2rem;color:#e0476f;animation:beat 1.2s infinite;display:block;margin-top:8px} </style></head><body><div class="hearts" id="hr"></div><main> <h1>Every day closer to you</h1><p class="sub">For my fiancée, with all my love</p><p class="orn">✦ ❤ ✦</p> <div class="wrap"><div class="car" id="car"></div> <div class="dots" id="dots"></div><div class="nav"><button onclick="go(-1)">&larr;</button><button onclick="go(1)">&rarr;</button></div></div> <div class="cd"><h2 id="ch">Until I meet you</h2> <div class="hw" id="hw"><svg viewBox="0 0 200 180" class="hs"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7aa8"/><stop offset="1" stop-color="#c2185b"/></linearGradient><linearGradient id="gd" x1="0" x2="1"><stop offset="0" stop-color="#f3d58a"/><stop offset="1" stop-color="#c9973a"/></linearGradient></defs> <path id="hp" d="M100 168 C20 110 4 70 4 50 C4 24 24 8 48 8 C70 8 90 22 100 40 C110 22 130 8 152 8 C176 8 196 24 196 50 C196 70 180 110 100 168Z" fill="rgba(255,255,255,.7)" stroke="url(#gd)" stroke-width="3"/> <path id="pr" d="M100 168 C20 110 4 70 4 50 C4 24 24 8 48 8 C70 8 90 22 100 40 C110 22 130 8 152 8 C176 8 196 24 196 50 C196 70 180 110 100 168Z" fill="none" stroke="url(#g)" stroke-width="5" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100"/></svg> <div class="hn"><b id="d">0</b><span>days to go</span></div></div> <div class="hms"><div><b id="h">0</b><span>hours</span></div><em>&hearts;</em><div><b id="m">0</b><span>minutes</span></div><em>&hearts;</em><div><b id="s">0</b><span>seconds</span></div></div> <p class="fin" id="fin">November 13, 2026<br>I love you, my forever.</p><span class="heart">&hearts;</span></div></main> <script> const U="https://cdn.gamma.app/e77v46hq6x5j95d/agent-uploads/"; const S=[["j4_tT--XwSUHUr2pj1vq2","You are my today and all of my tomorrows."],["N5ViY0RI9QaOuXjcpkqVa","I have found the one whom my soul loves. (Song of Solomon 3:4)"],["GG_lu4rYbqztIvLI-iaDK","Home is wherever you are."],["_9WJxYZ0jeE13gficZjrC","Your smile is my favourite place."],["GJWgE6MJqaIDNWalLSHv1","Every moment with you is a memory."],["aUUFfN7Kc3vpBon8Da-gz","Every adventure is better with you."],["uvbplHByJitcSFFaalJnh","Whatever our souls are made of, his and mine are the same. (Emily Brontë)"],["kAClRI3Z_v7DvvLQCS4lQ","I love you not only for what you are, but for what I am when I am with you. (Roy Croft)"],["o_Uzo4pypnvv7DfYZXw03","Always you, even on ordinary days."],["lLGBAEqnEh7YZXb4RBuuO","You make me fall in love again and again."],["yFNi-DQMmiQMbpsynwhv0","I would rather spend one lifetime with you than face all the ages of this world alone. (Tolkien)"]]; const car=document.getElementById('car'); S.forEach(x=>{car.insertAdjacentHTML('beforeend',`<div class="s"><img src="${U+x[0]}.jpg"><div class="t">${x[1]}</div></div>`)}); const dots=document.getElementById('dots');S.forEach(()=>dots.insertAdjacentHTML('beforeend','<span></span>')); function sync(){const n=Math.round(car.scrollLeft/car.clientWidth);[...dots.children].forEach((d,k)=>d.className=k==n?'on':'')} car.addEventListener('scroll',sync);sync(); const hr=document.getElementById('hr'),em=['❤','♥','💗','💕','✿']; for(let k=0;k<22;k++){const e=document.createElement('i');e.textContent=em[k%5];e.style.left=Math.random()*100+'%';e.style.fontSize=(14+Math.random()*22)+'px';e.style.color='#e0476f';e.style.animationDuration=(9+Math.random()*10)+'s';e.style.animationDelay=(Math.random()*12)+'s';hr.appendChild(e)} let i=0;function go(n){const k=car.children.length;i=(Math.round(car.scrollLeft/car.clientWidth)+n+k)%k;car.scrollTo({left:i*car.clientWidth,behavior:'smooth'})} setInterval(()=>go(1),5000); const T=new Date(2026,10,13,0,0,0).getTime(); const START=new Date(2026,9,26).getTime(); function tick(){let t=T-Date.now();if(t<=0){document.getElementById('ch').textContent="Today is the day!";document.querySelector('.hms').style.display='none';document.querySelector('.hn').innerHTML='<b>&hearts;</b>';document.getElementById('fin').innerHTML="I finally get to hold you.<br>I love you.";document.getElementById('pr').setAttribute('stroke-dasharray','100 0');return} const f=(id,v)=>document.getElementById(id).textContent=v;f('d',Math.floor(t/864e5));f('h',Math.floor(t/36e5)%24);f('m',Math.floor(t/6e4)%60);f('s',Math.floor(t/1e3)%60); const pr=Math.min(100,Math.max(0,(Date.now()-START)/(T-START)*100));document.getElementById('pr').setAttribute('stroke-dasharray',pr+' 100')} tick();setInterval(tick,1000); </script></body></html>
